name: Uyku ve Tarih V10.6 - No Text Natural Charon

on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Video konusu"
        required: true
        type: string
      project_slug:
        description: "Kalici proje kodu (ornek: istanbulun-fethi)"
        required: true
        type: string
      mode:
        description: "Once pilot calistir"
        required: true
        default: pilot
        type: choice
        options:
          - pilot
          - full
      stage:
        description: "Uretim asamasi"
        required: true
        default: all
        type: choice
        options:
          - all
          - plan
          - scripts
          - assets
          - tts
          - render
      chapter:
        description: "0=tumu, full modda 1-6 ile tek bolum"
        required: true
        default: "0"
        type: choice
        options:
          - "0"
          - "1"
          - "2"
          - "3"
          - "4"
          - "5"
          - "6"
      runner:
        description: "Pilot icin ubuntu-latest; uzun render icin self-hosted"
        required: true
        default: ubuntu-latest
        type: choice
        options:
          - ubuntu-latest
          - self-hosted

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"
  WIKIMEDIA_USER_AGENT: "UykuTarihV10/1.0 (${{ github.server_url }}/${{ github.repository }})"

jobs:
  longform:
    name: V10 longform agent
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 330

    steps:
      - name: Depoyu al
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-v10.txt

      - name: FFmpeg ve fontlari kur
        if: inputs.runner == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-liberation tesseract-ocr tesseract-ocr-eng tesseract-ocr-tur

      - name: Python kutuphanelerini kur
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-v10.txt

      - name: Onceki checkpointi geri yukle
        id: restore-project
        uses: actions/cache/restore@v4
        with:
          path: projects/${{ inputs.project_slug }}
          key: v10-${{ inputs.project_slug }}-${{ github.run_id }}
          restore-keys: |
            v10-${{ inputs.project_slug }}-

      - name: V10 ajanini calistir
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python src/v10_longform.py \
            --topic "${{ inputs.topic }}" \
            --project-slug "${{ inputs.project_slug }}" \
            --mode "${{ inputs.mode }}" \
            --stage "${{ inputs.stage }}" \
            --chapter "${{ inputs.chapter }}" \
            --target-minutes 60 \
            --pilot-minutes 10 \
            --chapters 6 \
            --beats-per-chapter 12

      - name: Checkpointi kaydet
        if: always()
        uses: actions/cache/save@v4
        with:
          path: projects/${{ inputs.project_slug }}
          key: v10-${{ inputs.project_slug }}-${{ github.run_id }}

      - name: Sonuclari indirilebilir kaydet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v10-${{ inputs.project_slug }}-${{ github.run_number }}
          path: |
            projects/${{ inputs.project_slug }}/deliverables/
            projects/${{ inputs.project_slug }}/state.json
            projects/${{ inputs.project_slug }}/story-plan.json
            projects/${{ inputs.project_slug }}/research.json
            projects/${{ inputs.project_slug }}/chapters/*/ASSET_GAPS.txt
            projects/${{ inputs.project_slug }}/chapters/*/assets-manifest.json
            projects/${{ inputs.project_slug }}/chapters/*/storyboard.jpg
          if-no-files-found: warn
          retention-days: 7
