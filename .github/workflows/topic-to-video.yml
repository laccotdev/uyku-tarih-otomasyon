name: Uyku ve Tarih - Konudan Videoya V3.1

on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Sadece video konusunu yaz"
        required: true
        default: "MÖ 1200'de Hattuşa'nın son gecesi"
        type: string

concurrency:
  group: uyku-tarih-topic-to-video
  cancel-in-progress: true

jobs:
  create-video:
    name: Konuyu anlayıp videoyu üret
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      VIDEO_TOPIC: ${{ inputs.topic }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
      TARGET_SECONDS: "75"
      SCENE_COUNT: "8"
      TEXT_MODEL: "gemini-3.5-flash-lite"
      TTS_MODEL: "gemini-3.1-flash-tts-preview"
      IMAGE_MODEL: "auto"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Projeyi al
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements-v3.txt

      - name: Video araçlarını kur
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-liberation

      - name: V3 paketlerini kur
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-v3.txt

      - name: Anahtarları kontrol et
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::GEMINI_API_KEY bulunamadı."
            exit 1
          fi
          if [ -z "$POLLINATIONS_API_KEY" ]; then
            echo "::error::POLLINATIONS_API_KEY bulunamadı."
            exit 1
          fi

      - name: Konudan videoya üret
        run: python src/topic_to_video.py

      - name: Çıktıları indirilebilir kaydet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: konudan-videoya-v3-1-${{ github.run_number }}
          path: output-v3/
          if-no-files-found: warn
          retention-days: 7
