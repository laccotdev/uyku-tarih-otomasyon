version: 11.4.1
project:
  data_root: ./data
  chapters: 6
  scenes_per_chapter: 18
  narration_words_per_minute: 118
  default_minutes: 60
  max_wall_minutes: 210
  maximum_cache_gb: 3.8
  duration_profiles:
    '5':
      chapters: 1
      scenes_per_chapter: 20
      script_parts: 2
    '10':
      chapters: 2
      scenes_per_chapter: 20
      script_parts: 2
    '30':
      chapters: 4
      scenes_per_chapter: 22
      script_parts: 3
    '60':
      chapters: 6
      scenes_per_chapter: 24
      script_parts: 4
gemini:
  text_models:
  - gemini-3.5-flash-lite
  - gemini-3.5-flash
  - gemini-3-flash-preview
  tts_model: gemini-3.1-flash-tts-preview
  voice: Charon
  json_retries: 3
  tts_retries: 6
  tts_retry_waits_seconds:
  - 10
  - 20
  - 40
  - 70
  - 110
  - 150
research:
  languages:
  - tr
  - en
  results_per_query: 5
  minimum_sources: 2
images:
  model: '@cf/black-forest-labs/flux-1-schnell'
  steps: 6
  width: 1344
  height: 768
  maximum_images_per_run: 70
  attempts_per_scene: 2
  target_clip_score: 0.19
  minimum_clip_score: 0.155
  ocr_confidence: 48
  maximum_ocr_chars: 4
  minimum_sharpness: 42
  minimum_brightness: 26
  maximum_brightness: 228
  style_bible: 'Premium photorealistic historical documentary film still. Historically
    grounded clothing, architecture, objects and geography. The named person or group,
    exact action and named place must appear together in one coherent widescreen frame.
    Serious cinema lighting, natural skin, realistic anatomy, crisp stone wood fabric
    and metal, rich controlled color, clear focal point, no collage and no generic
    empty scenery.

    '
  negative_prompt: 'text, words, letters, numbers, title, subtitle, caption, watermark,
    logo, signage, inscription, fake alphabet, pseudo-language, banner writing, document
    writing, map labels, infographic, timeline card, user interface, split screen,
    collage, modern clothing, modern vehicles, electricity, fantasy, cartoon, anime,
    blurry, washed out, deformed hands, extra fingers, duplicate people.

    '
  quality_mode: production_first
  hard_fail_on_quality: false
  prompt_max_bytes: 1250
  fallback_models:
  - '@cf/bytedance/stable-diffusion-xl-lightning'
  provider_mode: safe_profiles_with_fallback
  strict_story_mode: true
tts:
  chunk_words: 5000
  maximum_chunks_per_run: 2
  target_wpm: 108
  minimum_wpm: 95
  maximum_wpm: 138
  output_sample_rate: 48000
  instruction: Yalnızca Charon sesiyle oku. Tek ve değişmeyen, tok göğüs rezonanslı,
    olgun bir Türk tarih belgeseli anlatıcısı ol. Ses rengi bariton, sakin, güven
    veren ve otoriter olsun; bağırma veya teatralleşme. Yaklaşık dakikada 110-125
    kelime ritminde ilerle. Özel isimleri, tarihleri, neden-sonuç cümlelerini ve dönüm
    noktalarını acele etmeden söyle. Cümle sonlarında doğal kısa duraklar, paragraf
    geçişlerinde belirgin fakat uzun olmayan nefesler kullan. Haber spikeri, reklam,
    fragman, podcast sohbeti veya aşırı uykulu ton kullanma. Metne kelime ekleme,
    kelime çıkarma, başlık okuma veya ses efekti üretme.
  tempo_mode: normalize_and_continue
  minimum_tempo_factor: 0.97
  maximum_tempo_factor: 1.03
  chunk_crossfade_seconds: 0.08
  single_voice_track: true
render:
  width: 1920
  height: 1080
  fps: 24
  crf: 22
  preset: veryfast
  audio_bitrate: 192k
  subtle_zoom: 1.012
  transition_seconds: 0.58
  transitions:
  - dissolve
  - fade
  - smoothleft
  - dissolve
  - smoothright
youtube:
  enabled: false
  privacy_status: private
  category_id: '27'
